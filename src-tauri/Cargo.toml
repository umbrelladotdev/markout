[package]
name = "markout"
version = "0.2.0"
description = "Markout — éditeur Markdown local, aperçu Mermaid, export PDF et Word"
authors = ["Umbrella"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "markout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
